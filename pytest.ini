[pytest]
pythonpath = .
testpaths = tests
addopts = -q --strict-markers
# Warnings are errors so that pandas parsing warnings on new data surface as
# failures rather than scrolling past.
filterwarnings =
    error
    default::DeprecationWarning
    # Raised by starlette's TestClient on import; not our code.
    ignore:Using .httpx. with .starlette.testclient. is deprecated
