line-length = 100
target-version = "py311"

[lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplifications
]
ignore = [
    "B008", # FastAPI depends on callables in argument defaults (Query/Path)
]

[lint.per-file-ignores]
# Tests reach into `_prepare` to assert the placeholder translation directly.
"tests/*" = ["SLF001"]
