# Append-only audit log of contract/quality gate findings. Deliberately
# exempt from the drift-rebuild in Database.ensure_schema(): a schema change
# to tests/timeseries must never silently wipe this table's history.
table: data_quality_issues
append_only: true
columns:
  - name: id
    type: serial_pk
  - name: test_id
    type: str
  - name: rule
    type: str
    nullable: false
  - name: severity
    type: str
    nullable: false
  - name: message
    type: str
    nullable: false
  - name: source_path
    type: str
  - name: detected_at
    type: str
    nullable: false
indexes:
  - name: ix_quality_issues_detected_at
    columns: [detected_at]
